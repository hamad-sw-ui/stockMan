# StockMan Web (conteneur) : SPA statique + proxy /api vers le service « api ».
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité (le strict nécessaire pour une SPA)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Assets fingerprintés : cache long immutable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Jamais de cache sur index.html ni le service worker (déploiement frais)
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # Historique SPA : tout le reste retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
