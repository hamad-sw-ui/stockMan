# ============================================================================
# StockMan — exemple de vhost nginx de production (HTTPS, un seul point d'entrée)
#
#  - frontend statique (apps/web/dist) servi sur /
#  - API Node (PORT=5000, en écoute locale) proxifiée sur /api
#
# Installation :
#   sudo certbot --nginx -d stockman.example.com      # certificat Let's Encrypt
#   sudo cp nginx.stockman.example.conf /etc/nginx/sites-available/stockman
#   sudo ln -s /etc/nginx/sites-available/stockman /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Ajuster : server_name, chemins root, certificats.
# ============================================================================

# HTTP → HTTPS
server {
    listen 80;
    server_name stockman.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stockman.example.com;

    ssl_certificate     /etc/letsencrypt/live/stockman.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockman.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/stockman/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # En-têtes de sécurité (SPA + API cookies SameSite)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Assets fingerprintés par Vite : cache agressif
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Jamais de cache : shell, manifeste, service worker
    location = /index.html          { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /sw.js               { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    # Historique SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
