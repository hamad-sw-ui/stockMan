name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockman
          POSTGRES_PASSWORD: stockman
          POSTGRES_DB: stockman
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockman -d stockman"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://stockman:stockman@localhost:5432/stockman
      JWT_SECRET: ci-secret-access-0123456789abcdef0123456789abcdef
      REFRESH_SECRET: ci-secret-refresh-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace apps/api
      - name: Migrations sur vraie Postgres (chaîne rejouable de zéro)
        run: npm run migrate --workspace apps/api
      - name: Migrations idempotentes (second run)
        run: npm run migrate --workspace apps/api
      - name: Seed production (plans)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seeds/001_plans.sql
      - name: Seed démo rejouable (comptes de démonstration)
        run: npm run seed:dev --workspace apps/api && npm run seed:dev --workspace apps/api
      - name: Tests API (unitaires + intégration)
        run: npm run test --workspace apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace apps/web
      - name: Tests Web
        run: npm run test --workspace apps/web
      - name: Build production
        run: npm run build --workspace apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit des dépendances (échec si vulnérabilité haute)
        run: npm audit --audit-level=high

  # Migrateur V1 → V2 joué de bout en bout sur une VRAIE Postgres 16 :
  # Schéma legacy → données V1 → --check → --apply → chaîne V2 idempotente.
  migrate-v1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockman
          POSTGRES_PASSWORD: stockman
          POSTGRES_DB: stockman
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockman -d stockman"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://stockman:stockman@localhost:5432/stockman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schéma legacy V1 (fichiers historiques)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/legacy/database.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/legacy/migration_phase3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/legacy/migration_phase3_movements.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/legacy/migration_phase4.sql
      - name: Données V1 représentatives (doublons, PIN clair, plan libre)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id, name, subdomain) VALUES
            ('11111111-1111-4111-8111-111111111111','Boutique CI','ci');
          INSERT INTO depots (id, tenant_id, name) VALUES
            ('21111111-1111-4111-8111-111111111111','11111111-1111-4111-8111-111111111111','Principal'),
            ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','Annexe');
          INSERT INTO users (id, tenant_id, email, password_hash, name, role, pin_code, created_at) VALUES
            ('31111111-1111-4111-8111-111111111111','11111111-1111-4111-8111-111111111111','CI@Demo.CM','x','Gérant','ADMIN','4321','2024-01-01'),
            ('32222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','vendeur@demo.cm','x','Vendeur','VENDEUR','1234','2024-01-02');
          INSERT INTO licenses (id, tenant_id, plan_name, status, start_date, end_date) VALUES
            (gen_random_uuid(), '11111111-1111-4111-8111-111111111111', 'Professionnel', 'ACTIVE', '2025-01-01', '2030-01-01');
          INSERT INTO units (id, tenant_id, name, symbol) VALUES
            ('41111111-1111-4111-8111-111111111111','11111111-1111-4111-8111-111111111111','Pièce','Pce');
          INSERT INTO products (id, tenant_id, depot_id, name, barcode, purchase_price, selling_price, quantity, unit_id, expiration_date, created_at) VALUES
            ('51111111-1111-4111-8111-111111111111','11111111-1111-4111-8111-111111111111','21111111-1111-4111-8111-111111111111','Eau 1.5L','6001',200,400,100,'41111111-1111-4111-8111-111111111111','2027-06-01','2024-02-01'),
            ('52222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222','Eau 1.5L','6001',200,400,50,'41111111-1111-4111-8111-111111111111','2027-06-01','2024-02-02');
          INSERT INTO sales (id, tenant_id, depot_id, vendor_id, total_amount, payment_method) VALUES
            ('61111111-1111-4111-8111-111111111111','11111111-1111-4111-8111-111111111111','21111111-1111-4111-8111-111111111111','32222222-2222-4222-8222-222222222222',400,'CASH');
          INSERT INTO sale_items (id, sale_id, product_id, quantity, unit_price, total_price) VALUES
            (gen_random_uuid(), '61111111-1111-4111-8111-111111111111', '52222222-2222-4222-8222-222222222222', 2, 200, 400);
          SQL
      - name: Migrateur — rapport d'écarts (--check, lecture seule)
        run: node scripts/migrate-v1-to-v2.js --check
      - name: Migrateur — application (--apply) + rapport JSON
        run: node scripts/migrate-v1-to-v2.js --apply --report /tmp/rapport.json && cat /tmp/rapport.json
      - name: Vérifications post-migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- PIN en clair disparu, hash bcrypt présent
          SELECT 1/(CASE WHEN COUNT(*)=0 THEN 1 ELSE 0 END) FROM information_schema.columns
            WHERE table_name='users' AND column_name='pin_code';
          SELECT 1/(CASE WHEN COUNT(*)=2 THEN 1 ELSE 0 END) FROM users WHERE pin_hash LIKE '$2%';
          -- Catalogue fusionné : 1 produit, stock 100+50 réparti par dépôt
          SELECT 1/(CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END) FROM products;
          SELECT 1/(CASE WHEN (SELECT SUM(quantity) FROM stock_levels)=150 THEN 1 ELSE 0 END);
          -- Licence rattachée au plan PRO, vente historique complétée
          SELECT 1/(CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END) FROM licenses WHERE plan_code='PRO';
          SELECT 1/(CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END) FROM sale_items WHERE base_qty=2;
          -- Table V2 créées par la chaîne
          SELECT 1/(CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END) FROM information_schema.tables WHERE table_name='stock_receipts';
          SQL
      - name: Chaîne V2 idempotente après migration (rien à appliquer)
        run: npm run migrate --workspace apps/api
      - name: Migrateur sur base déjà V2 → code de sortie 2 (rien à faire)
        run: |
          node scripts/migrate-v1-to-v2.js --check && exit 1 || test $? -eq 2

  # Fumée d'intégration : l'image Docker de production telle que livrée.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichier d'environnement CI
        run: |
          printf 'JWT_SECRET=ci-secret-access-0123456789abcdef0123456789abcdef\nREFRESH_SECRET=ci-secret-refresh-0123456789abcdef0123456789abcdef\n' > .env
      - name: Démarrage de la pile complète
        run: docker compose up -d --build
      - name: Attente de santé de l’API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/api/health | grep -q '"db":true'; then echo OK; exit 0; fi
            sleep 3
          done
          echo 'API jamais prête'; docker compose logs; exit 1
      - name: Smoke fonctionnel (inscription → login → catalogue → web)
        run: |
          set -e
          curl -fsS -X POST http://localhost:5000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"tenantName":"CI Smoke SARL","userName":"Gérant CI","email":"ci-smoke@test.cm","password":"Passw0rd!CI"}' -o /tmp/reg.json
          TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/reg.json')).accessToken)")
          curl -fsS http://localhost:5000/api/products -H "Authorization: Bearer $TOKEN" | grep -q '"data"'
          curl -fsS http://localhost:5000/api/openapi.json | grep -q '"openapi":"3.0.3"'
          curl -fsS http://localhost:8080/ | grep -qi 'stockman'
          curl -fsS http://localhost:8080/api/health | grep -q '"db":true'
      - name: Journaux en cas d’échec
        if: failure()
        run: docker compose logs --tail=200
      - name: Extinction
        if: always()
        run: docker compose down -v
